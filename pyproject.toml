[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frc-architecture-modeler"
version = "0.1.0"
description = "Local-first architecture modeling for FRC command-based robots."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FRC Architecture Modeler contributors" }]
dependencies = [
    "PySide6>=6.7,<7",
    "tree-sitter>=0.23,<0.27",
    "tree-sitter-java>=0.23,<0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]
build = [
    "pyinstaller>=6.0,<7",
]

[project.scripts]
frc-architecture-modeler = "frc_arch_modeler.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
